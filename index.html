<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRENDMUSIC</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07090c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4efe8;--sub:#9a9fa8;--acc:#f5b942;--glow:#7fe9ff;--bg:#07090c;--ease:cubic-bezier(.22,1,.36,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:radial-gradient(120% 55% at 50% 0%,#20121a 0%,var(--bg) 62%);overflow:hidden;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;outline:none}
button:focus-visible{box-shadow:0 0 0 3px var(--acc);border-radius:50%}
svg{width:24px;height:24px;fill:currentColor;display:block}
.app{position:relative;max-width:480px;height:100%;margin:auto}
.screen{position:absolute;inset:0;overflow-y:auto;padding:22px 18px 190px;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(10px);transition:opacity .45s var(--ease),transform .6s var(--ease),visibility 0s .45s;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.on{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition-delay:0s}
h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-bottom:4px}
h2{font-size:18px;font-weight:800;margin:26px 0 12px}
.sub{color:var(--sub);font-size:14px}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
/* reactor hero */
.stage{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 114px);width:210px;height:260px;margin-left:-105px;pointer-events:none;transform-origin:50% 0;transition:opacity .9s var(--ease),transform .9s var(--ease)}
.stage>*{opacity:var(--so,1)}
body:not([data-tab=home]) .stage *,body.po .stage *{animation-play-state:paused}
body:not([data-tab=home]) .stage{opacity:.3;transform:translateY(-36px) scale(.78)}
.hero{height:360px;border-radius:32px;margin-top:18px;position:relative;overflow:hidden;cursor:pointer;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.12);transition:transform .45s var(--ease)}
.hero:active{transform:scale(.975)}
.rx{position:absolute;left:0;top:0;width:210px;height:210px}
.rx:before{content:"";position:absolute;inset:-45%;background:radial-gradient(circle,rgba(127,233,255,.34),transparent 60%);}
.rx svg{position:absolute;inset:0;width:100%;height:100%;will-change:transform}
.ra{animation:spin 60s linear infinite}.rc{animation:spin 24s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes bloom{50%{opacity:.55}}
.nm{position:absolute;left:-60px;right:-60px;top:230px;text-align:center;font-weight:800;font-size:21px;letter-spacing:.32em;text-indent:.32em;background:linear-gradient(90deg,#ffe08a,#f5b942,#e0533d);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .gl{position:absolute;left:12px;right:12px;bottom:12px;border-radius:22px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;background:rgba(16,14,18,.78)}
.hero b{font-size:19px;display:block}
.pbtn{width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,#ffd777,#e08a22);border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 10px rgba(245,185,66,.25);color:#1a0f02;display:grid;place-items:center;transition:transform .4s var(--ease)}
.pbtn:active{transform:scale(.9);transition-duration:.15s}
.rail{display:flex;gap:14px;overflow-x:auto;margin:0 -18px;padding:0 18px 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.rail::-webkit-scrollbar{display:none}
.card{flex:0 0 138px;scroll-snap-align:start;cursor:pointer;transition:transform .4s var(--ease)}
.card:active{transform:scale(.95)}
.art{border-radius:22px;aspect-ratio:1;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.card .art{margin-bottom:8px}
.card b,.row b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:22px;margin-bottom:10px;cursor:pointer;transition:transform .35s var(--ease),background .35s}
.row:active{transform:scale(.97)}
.row.now{background:linear-gradient(145deg,rgba(245,185,66,.22),rgba(245,185,66,.06));border-color:rgba(245,185,66,.4)}
.row .art{width:54px;border-radius:16px;flex:none}
.row div.m{flex:1;min-width:0}
.rank{width:22px;text-align:center;font-weight:800;color:var(--acc);font-size:18px}
.ib{width:40px;height:40px;display:grid;place-items:center;color:var(--sub);transition:transform .35s var(--ease),color .3s,opacity .3s}
.ib:active{transform:scale(.86);opacity:.6;transition-duration:.12s}
.ib.on{color:var(--acc)}
.search{display:flex;align-items:center;gap:10px;padding:0 16px;height:52px;border-radius:26px;margin:16px 0}
.search input{flex:1;background:none;border:0;outline:0;font:inherit;font-size:16px;color:var(--ink);user-select:text}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:18px}
.chip{flex:none;padding:9px 16px;border-radius:20px;font-weight:600;font-size:14px;transition:transform .35s var(--ease),background .3s,color .3s}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--acc);color:#1a0f02;border-color:var(--acc)}
.seg{display:flex;padding:4px;border-radius:22px;margin:16px 0;position:relative}
.seg button{flex:1;height:38px;font-weight:600;position:relative;z-index:1;transition:color .3s}
.seg .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:18px;background:rgba(245,185,66,.25);border:1px solid rgba(245,185,66,.5);transition:transform .55s var(--ease)}
.addbtn{display:inline-flex;margin-top:12px;padding:10px 18px;border-radius:20px;font-weight:600;color:var(--acc);cursor:pointer;transition:transform .35s var(--ease)}.addbtn:active{transform:scale(.95)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.acts .addbtn{margin-top:0}
.empty{text-align:center;color:var(--sub);padding:40px 10px}
.tabs,.mini{background:linear-gradient(145deg,rgba(40,36,44,.92),rgba(18,16,22,.92))}
.tabs{position:absolute;left:16px;right:16px;bottom:14px;height:68px;border-radius:34px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;z-index:5}
.ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:28px;background:linear-gradient(145deg,rgba(245,185,66,.3),rgba(245,185,66,.1));border:1px solid rgba(245,185,66,.5);transition:transform .6s var(--ease);will-change:transform}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--sub);transition:color .4s,transform .35s var(--ease)}
.tab.on{color:var(--acc)}
.tab:active{transform:scale(.92)}
.mini{position:absolute;left:16px;right:16px;bottom:92px;height:64px;border-radius:32px;display:none;align-items:center;gap:12px;padding:0 10px;z-index:5;cursor:pointer;overflow:hidden}
.mini.show{display:flex;animation:in .5s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.985)}}
.mini .art{width:46px;border-radius:50%}
.mini .m{flex:1;min-width:0}
.mini b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);width:0;transition:width .27s linear}.mini.snap .bar{transition:none}
.full{position:absolute;inset:0;z-index:10;padding:18px 26px 28px;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .75s var(--ease);background:#0a0c10;overflow:hidden;will-change:transform}
.full.open{transform:none}
.full .top{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-weight:600}
.big{width:100%;margin:22px auto 0;aspect-ratio:1;max-width:340px;border-radius:38px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.22);transition:transform .8s var(--ease),opacity .6s var(--ease);opacity:0;transform:scale(.88);box-shadow:0 20px 44px rgba(0,0,0,.55)}
.playing .big{transform:scale(1)}.big:after{content:"";position:absolute;inset:0;background:linear-gradient(155deg,rgba(255,255,255,.34),rgba(255,255,255,0) 42%)}.full.open .big{opacity:1}
.full>:not(.big):not(.top){opacity:0;transform:translateY(26px);transition:opacity .5s var(--ease),transform .8s var(--ease)}
.full.open>:not(.big):not(.top){opacity:1;transform:none}
.full.open>:nth-child(3){transition-delay:.1s}.full.open>:nth-child(4){transition-delay:.17s}.full.open>:nth-child(5){transition-delay:.24s}
.ttl{display:flex;align-items:center;justify-content:space-between;margin-top:26px}
.ttl h1{font-size:24px}
.prog{margin-top:18px}
.track{height:6px;border-radius:3px;background:rgba(255,255,255,.14);position:relative;cursor:pointer;touch-action:none}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--acc);width:0;transition:width .27s linear}.track.snap i{transition:none}.track i:after{transition:transform .3s var(--ease)}.track.snap i:after{transform:scale(1.4)}
.track i:after{content:"";position:absolute;right:-5px;top:-5px;width:10px;height:16px;border-radius:5px;background:rgba(255,255,255,.92)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:10px;font-weight:600}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding:0 4px}
.ctl .ib{width:50px;height:50px}
.ctl .pbtn{width:78px;height:78px;border-radius:30px;background:linear-gradient(145deg,rgba(245,185,66,.42),rgba(245,185,66,.14));color:#ffe6a8;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.ctl .pbtn svg{width:34px;height:34px}
.eq{display:flex;gap:2px;align-items:flex-end;height:16px;width:16px}
.eq u{flex:1;background:var(--acc);height:30%;border-radius:2px}
.playing .eq u{animation:eq .8s ease-in-out infinite alternate}
.eq u:nth-child(2){animation-delay:-.3s!important}.eq u:nth-child(3){animation-delay:-.6s!important}
@keyframes eq{to{height:100%}}
.toast{position:absolute;left:50%;top:22px;transform:translate(-50%,-90px);padding:10px 18px;border-radius:20px;font-weight:600;font-size:14px;z-index:20;background:#1c1a20;transition:transform .5s var(--ease)}
.toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="app" id="app">
  <div class="toast glass" id="toast"></div>
  <section class="screen on" id="home"></section>
  <section class="screen" id="trending"></section>
  <section class="screen" id="search">
    <h1>Search</h1><div class="sub">Songs, artists and moods</div>
    <label class="search glass"><svg viewBox="0 0 24 24" style="width:20px;color:var(--sub)"><path d="M10 3a7 7 0 015.6 11.2l4.6 4.6-1.4 1.4-4.6-4.6A7 7 0 1110 3zm0 2a5 5 0 100 10 5 5 0 000-10z"/></svg><input id="q" placeholder="What do you want to hear?" autocomplete="off"></label>
    <div class="chips" id="chips"></div><div id="results"></div>
  </section>
  <section class="screen" id="library">
    <h1>Library</h1><div class="sub">Your saved music</div>
    <button class="addbtn glass" data-add>+ Add songs</button><input id="file" type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac,.flac,.opus" multiple style="display:none">
    <div class="seg glass"><i class="pill" id="pill"></i><button data-seg="0">Liked</button><button data-seg="1">Playlists</button><button data-seg="2">My songs</button></div>
    <div id="libbody"></div>
  </section>
  <div class="mini glass" id="mini">
    <div class="art" id="miniArt"></div>
    <div class="m"><b id="miniT"></b><span class="sub" id="miniA"></span></div>
    <button class="ib" id="miniPrev" aria-label="Previous"></button>
    <button class="pbtn" id="miniPlay" aria-label="Play or pause" style="width:42px;height:42px"></button>
    <button class="ib" id="miniNext" aria-label="Next"></button>
    <div class="bar" id="miniBar"></div>
  </div>
  <nav class="tabs glass" id="tabs"><i class="ind" id="ind"></i></nav>
  <div class="full" id="full">
    <div class="top"><button class="ib" id="close" aria-label="Close player"></button><span>Now playing</span><div class="eq"><u></u><u></u><u></u></div></div>
    <div class="art big" id="bigArt"></div>
    <div class="ttl"><div><h1 id="fT"></h1><div class="sub" id="fA"></div></div><button class="ib" id="fLike" aria-label="Like"></button></div>
    <div class="prog"><div class="track" id="track"><i id="fill"></i></div><div class="times"><span id="tc">0:00</span><span id="td">0:00</span></div></div>
    <div class="ctl">
      <button class="ib" id="shuf" aria-label="Shuffle"></button>
      <button class="ib" id="prev" aria-label="Previous"></button>
      <button class="pbtn" id="play" aria-label="Play or pause"></button>
      <button class="ib" id="next" aria-label="Next"></button>
      <button class="ib" id="rep" aria-label="Repeat"></button>
    </div>
  </div>
</div>
<audio id="au" preload="auto"></audio>
<script>
const I={home:'M12 3l9 7.5V21h-6v-6H9v6H3V10.5z',fire:'M12 2c1 4 6 6 6 12a6 6 0 01-12 0c0-3 2-4 3-6 1 2 2 2 2 2 1-3 1-5 1-8z',
search:'M10 3a7 7 0 015.6 11.2l4.6 4.6-1.4 1.4-4.6-4.6A7 7 0 1110 3zm0 2a5 5 0 100 10 5 5 0 000-10z',
lib:'M4 4h3v16H4zm5 0h3v16H9zm5.5.5l2.8-.8 3.5 15.4-2.8.8z',
play:'M8 5v14l11-7z',pause:'M6 5h4v14H6zm8 0h4v14h-4z',next:'M6 6l9 6-9 6zm10 0h2.5v12H16z',prev:'M18 6l-9 6 9 6zM8 6H5.5v12H8z',
heart:'M12 21l-1.4-1.3C5.4 15 2 12 2 8.5 2 5.5 4.3 3.5 7 3.5c1.7 0 3.4.9 5 2.7 1.6-1.8 3.3-2.7 5-2.7 2.700 0 5 2 5 5 0 3.500-3.400 6.500-8.600 11.200z',
shuf:'M16 3h5v5l-2-2-4.500 4.500-1.400-1.400L17.600 5zM3 6h4l9 12h3l-2-2 1.400-1.400L21 19l-4.600 4.600L15 22.200 17 20h-1.500L7 8H3zm0 11h3l1.800-2.300 1.300 1.800L7.500 19H3z',
rep:'M7 7h10v-3l4 4-4 4V9H7v3H5V7zm10 10H7v3l-4-4 4-4v3h10v-3h2v5z',down:'M6 9l6 6 6-6-1.500-1.500L12 12 7.500 7.500z'};
const ic=(n,s)=>`<svg viewBox="0 0 24 24"${s?` style="${s}"`:''}><path d="${I[n]}"/></svg>`;
const T=[
{t:'Glass Hours',a:'Lumen Park',h:[205,230],bpm:96,r:57,d:187,g:'Chill'},
{t:'Neon Tides',a:'Kairo & Vee',h:[190,160],bpm:118,r:62,d:201,g:'Dance'},
{t:'Skyline Static',a:'Orbit Youth',h:[15,340],bpm:104,r:55,d:174,g:'Pop'},
{t:'Paper Planes',a:'Mira Solis',h:[40,15],bpm:88,r:60,d:195,g:'Chill'},
{t:'Midnight Bus',a:'Nova Lane',h:[250,290],bpm:124,r:53,d:210,g:'Dance'},
{t:'Soft Reboot',a:'Tomo Ito',h:[165,200],bpm:92,r:59,d:168,g:'Focus'},
{t:'Heatwave Radio',a:'Sunday Club',h:[350,30],bpm:110,r:64,d:182,g:'Pop'},
{t:'Deep Focus 4',a:'Arlo Fen',h:[215,185],bpm:76,r:52,d:240,g:'Focus'}];
const art=t=>`background:radial-gradient(circle at 25% 20%,hsla(${t.h[1]},95%,85%,.85),transparent 55%),linear-gradient(135deg,hsl(${t.h[0]},80%,55%),hsl(${t.h[1]},75%,40%))`;
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const $=id=>document.getElementById(id);
const S={cur:-1,playing:false,time:0,liked:new Set([0,3]),shuf:false,rep:false,tab:'home',seg:0,genre:'All',ctx:[0,1,2,3,4,5,6,7]};

const V='viewBox="0 0 600 600" fill="none"';
const reactor=`<div class="rx">
<svg ${V}><defs><linearGradient id="mt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef2f6"/><stop offset=".35" stop-color="#6b727c"/><stop offset=".65" stop-color="#2a2e34"/><stop offset="1" stop-color="#b4bcc5"/></linearGradient><radialGradient id="bk"><stop offset="0" stop-color="#05070a"/><stop offset="1" stop-color="#1a2028"/></radialGradient></defs><circle cx="300" cy="300" r="290" stroke="url(#mt)" stroke-width="18"/><circle cx="300" cy="300" r="281" fill="url(#bk)"/><circle cx="300" cy="300" r="272" stroke="#000" stroke-opacity=".6" stroke-width="3"/></svg>
<svg class="ra" ${V}><defs><linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset=".55" stop-color="#c47c20"/><stop offset="1" stop-color="#6b3c0e"/></linearGradient></defs><circle cx="300" cy="300" r="215" stroke="url(#gd)" stroke-width="54" stroke-dasharray="96 16.57"/><circle cx="300" cy="300" r="244" stroke="#000" stroke-opacity=".55" stroke-width="4"/><circle cx="300" cy="300" r="186" stroke="#000" stroke-opacity=".55" stroke-width="4"/></svg>
<svg class="rc" ${V}><circle cx="300" cy="300" r="150" stroke="#7fe9ff" stroke-width="8" stroke-dasharray="26 10"/><circle cx="300" cy="300" r="128" stroke="#7fe9ff" stroke-opacity=".35" stroke-width="2"/></svg>
<svg class="rp" ${V}><defs><radialGradient id="cr"><stop offset="0" stop-color="#fff"/><stop offset=".22" stop-color="#c4f7ff"/><stop offset=".55" stop-color="#4fd2f2" stop-opacity=".7"/><stop offset="1" stop-color="#4fd2f2" stop-opacity="0"/></radialGradient></defs><circle cx="300" cy="300" r="125" fill="url(#cr)"/><circle cx="300" cy="300" r="64" stroke="#fff" stroke-width="5" stroke-opacity=".9"/></svg>
</div>`;

const row=(i,rank,list)=>{const t=T[i];return `<div class="row glass ${i===S.cur?'now':''}" data-p="${i}" data-l="${list}">${rank?`<span class="rank">${rank}</span>`:''}<div class="art" style="${art(t)}"></div><div class="m"><b>${t.t}</b><span class="sub">${t.a}</span></div><button class="ib ${S.liked.has(i)?'on':''}" data-like="${i}" aria-label="Like">${ic('heart')}</button></div>`};
const card=i=>`<div class="card" data-p="${i}" data-l="all"><div class="art" style="${art(T[i])}"></div><b>${T[i].t}</b><span class="sub">${T[i].a}</span></div>`;

function renderHome(){const h=new Date().getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening',f=T[1];
$('home').innerHTML=`<h1>${g}</h1><div class="sub">Fresh sounds, picked for you</div>
<div class="hero" data-p="1" data-l="all"><div class="gl glass"><div><span class="sub">Featured today</span><b>${f.t}</b><span class="sub">${f.a}</span></div><div class="pbtn">${ic('play')}</div></div></div>
<div class="acts"><button class="addbtn glass" data-add>+ Add songs</button>${matchMedia('(display-mode: standalone)').matches?'':'<button class="addbtn glass" data-install>Install app</button>'}</div>
<h2>Made for you</h2><div class="rail">${[0,3,5,7,2].map(card).join('')}</div>
<h2>Fresh this week</h2><div class="rail">${[4,6,1,2,0].map(card).join('')}</div><div class="sub" style="text-align:center;margin-top:26px;font-size:12px">TRENDMUSIC v2</div>`}
function renderTrending(){$('trending').innerHTML=`<h1>Trending</h1><div class="sub">Most played right now</div><div style="margin-top:18px">${[1,4,6,2,0,3,5,7].map((i,n)=>row(i,n+1,'trend')).join('')}</div>`}
function renderSearch(){const q=$('q').value.trim().toLowerCase(),gs=['All','Pop','Dance','Chill','Focus'];
$('chips').innerHTML=gs.map(x=>`<button class="chip glass ${x===S.genre?'on':''}" data-g="${x}">${x}</button>`).join('');
const r=T.map((t,i)=>i).filter(i=>(S.genre==='All'||T[i].g===S.genre)&&(T[i].t+T[i].a).toLowerCase().includes(q));
$('results').innerHTML=r.length?r.map(i=>row(i,0,'s')).join(''):'<div class="empty">No matches. Try another word or pick a different genre.</div>'}
function renderLib(){$('pill').style.transform=`translateX(${S.seg*100}%)`;
document.querySelectorAll('[data-seg]').forEach(b=>b.style.color=+b.dataset.seg===S.seg?'var(--acc)':'var(--sub)');
if(S.seg===0){const l=[...S.liked];$('libbody').innerHTML=l.length?l.map(i=>row(i,0,'lib')).join(''):'<div class="empty">Tap the heart on any song to save it here.</div>'}
else if(S.seg===2){const m=T.map((t,i)=>t.up?i:-1).filter(i=>i>=0);$('libbody').innerHTML=m.length?m.map(i=>row(i,0,'mine')).join(''):'<div class="empty">No songs yet. Tap “Add songs” to pick audio files from your phone.</div>'}else $('libbody').innerHTML=[['Morning Drive',[2,6,1]],['Late Night',[4,0,3]],['Study Session',[5,7,0]]].map(([n,l])=>`<div class="row glass" data-pl="${l}"><div class="art" style="${art(T[l[0]])}"></div><div class="m"><b>${n}</b><span class="sub">${l.length} songs</span></div><span class="ib">${ic('play')}</span></div>`).join('')}

const tabs=[['home','Home','home'],['trending','Trending','fire'],['search','Search','search'],['library','Library','lib']];
$('tabs').insertAdjacentHTML('beforeend',tabs.map(([id,l,i])=>`<button class="tab" data-t="${id}">${ic(i)}${l}</button>`).join(''));
function go(id){S.tab=id;document.body.dataset.tab=id;document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===id));
$('ind').style.transform=`translateX(${tabs.findIndex(t=>t[0]===id)*100}%)`;
({home:renderHome,trending:renderTrending,search:renderSearch,library:renderLib})[id]()}
function mark(){document.querySelectorAll('.row[data-p]').forEach(r=>r.classList.toggle('now',+r.dataset.p===S.cur))}

let ac,master,timer,step=0;const sc=[0,3,5,7,10,12,15];
function note(f,t,len,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);g.connect(master);o.start(t);o.stop(t+len+.05)}
function tick(){const t=T[S.cur],sp=60/t.bpm/2,now=ac.currentTime+.05,hz=n=>440*Math.pow(2,(t.r+n-69)/12);
if(step%8===0)[0,7,12].forEach(n=>note(hz(n-12),now,sp*8,'sine',.05));
if(step%4===0)note(hz(sc[(step/4|0)%3*2]-24),now,sp*3,'triangle',.12);
const k=(step*7+S.cur*3)%11;if(k%3!==1)note(hz(sc[k%sc.length]+12),now,sp*1.6,'triangle',.07);step++}
function startAudio(){stopAudio();const u=T[S.cur];if(u.url){if(au.src!==u.url)au.src=u.url;else if(S.time===0)au.currentTime=0;au.play().catch(()=>toast("Tap play to start"));return}
if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.8;master.connect(ac.destination)}
ac.resume();step=0;timer=setInterval(tick,60/T[S.cur].bpm/2*1000);tick()}
function stopAudio(){clearInterval(timer);au.pause();if(ac)ac.suspend()}

function paint(){const t=T[S.cur];if(!t)return;
$('mini').classList.add('show');$('miniArt').style.cssText=art(t);$('bigArt').style.cssText=art(t);
$('full').style.background=`radial-gradient(circle at 50% 16%,hsla(${t.h[0]},70%,42%,.5),transparent 62%),#0a0c10`;
$('miniT').textContent=$('fT').textContent=t.t;$('miniA').textContent=$('fA').textContent=t.a;$('td').textContent=fmt(t.d);
$('fLike').innerHTML=ic('heart');$('fLike').classList.toggle('on',S.liked.has(S.cur));
$('full').classList.toggle('playing',S.playing);
const p=S.playing?'pause':'play';$('play').innerHTML=ic(p);$('miniPlay').innerHTML=ic(p,'width:20px');
$('shuf').classList.toggle('on',S.shuf);$('rep').classList.toggle('on',S.rep)}
function prog(){const t=T[S.cur],pc=t.d?S.time/t.d*100:0;$('fill').style.width=pc+'%';$('miniBar').style.width=pc+'%';$('tc').textContent=fmt(S.time)}
function animTrack(){const d=S.dir||1;S.dir=0;const o={duration:650,easing:'cubic-bezier(.22,1,.36,1)'};
$('bigArt').animate([{opacity:0,transform:`translateX(${d*70}px) scale(.86) rotate(${d*4}deg)`},{opacity:1,transform:'translateX(0) scale(1) rotate(0deg)'}],o);
[$('fT'),$('fA')].forEach((e,i)=>e.animate([{opacity:0,transform:`translateX(${d*24}px)`},{opacity:1,transform:'none'}],{...o,delay:60+i*40,fill:'backwards'}))}
function snap(on){const a=[$("track"),$("mini")];if(on)a.forEach(e=>e.classList.add("snap"));else requestAnimationFrame(()=>requestAnimationFrame(()=>a.forEach(e=>e.classList.remove("snap"))))}
function playIdx(i,list){if(list)S.ctx=list;S.cur=i;S.time=0;S.playing=true;snap(1);paint();prog();mark();animTrack();snap(0);setTimeout(startAudio,0)}
function toggle(){if(S.cur<0)return;S.playing=!S.playing;paint();setTimeout(()=>S.playing?startAudio():stopAudio(),0)}
function skip(d,auto){const l=S.ctx,p=l.indexOf(S.cur);let n;
if(auto&&S.rep)n=S.cur;else if(S.shuf)n=l[Math.floor(Math.random()*l.length)];else n=l[(p+d+l.length)%l.length];S.dir=d;playIdx(n)}
setInterval(()=>{if(!S.playing)return;const t=T[S.cur];if(t.url){S.time=au.currentTime;if(au.ended||(t.d&&S.time>=t.d-.05))return skip(1,true);prog();return}S.time+=.25;if(S.time>=t.d)skip(1,true);else prog()},250);
au.onloadedmetadata=()=>{const t=T[S.cur];if(t&&t.url){t.d=au.duration;$('td').textContent=fmt(t.d)}};
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
function like(i){S.liked.has(i)?(S.liked.delete(i),toast('Removed from Liked')):(S.liked.add(i),toast('Added to Liked'));
document.querySelectorAll('[data-like="'+i+'"]').forEach(b=>b.classList.toggle('on',S.liked.has(i)));paint();if(S.tab==='library'&&S.seg===0)setTimeout(renderLib,300)}
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
function install(){if(dp){dp.prompt();dp=null}else toast('Browser menu ⋮ → Add to Home screen')}
const lists={all:[0,1,2,3,4,5,6,7],trend:[1,4,6,2,0,3,5,7]};

document.addEventListener('click',e=>{const x=s=>e.target.closest(s);let el;
if(x('[data-add]'))return $('file').click();
if(x('[data-install]'))return install();
if(el=x('[data-like]'))return like(+el.dataset.like);
if(el=x('[data-pl]'))return playIdx(+el.dataset.pl.split(',')[0],el.dataset.pl.split(',').map(Number));
if(el=x('[data-p]')){const l=el.dataset.l;let list=lists[l];if(l==='s')list=[...document.querySelectorAll('#results [data-p]')].map(r=>+r.dataset.p);if(l==='lib')list=[...S.liked];if(l==='mine')list=T.map((t,i)=>t.up?i:-1).filter(i=>i>=0);return playIdx(+el.dataset.p,list)}
if(el=x('[data-t]'))return go(el.dataset.t);
if(el=x('[data-g]')){S.genre=el.dataset.g;return renderSearch()}
if(el=x('[data-seg]')){S.seg=+el.dataset.seg;return renderLib()}});
$('q').addEventListener('input',renderSearch);
$('file').addEventListener('change',e=>{const fs=[...e.target.files];if(!fs.length)return;
fs.forEach(f=>{const h=Math.floor(Math.random()*360),t={t:f.name.replace(/\.[^.]+$/,''),a:'My upload',h:[h,(h+40)%360],d:0,g:'Mine',up:true,url:URL.createObjectURL(f)},i=T.push(t)-1,a=new Audio();a.preload='metadata';a.src=t.url;a.onloadedmetadata=()=>{t.d=a.duration;if(S.cur===i)paint()}});
e.target.value='';S.seg=2;go('library');toast(fs.length+(fs.length>1?' songs added':' song added'))});
$('mini').addEventListener('click',e=>{if(!e.target.closest('button')){$('full').classList.add('open');document.body.classList.add('po')}});
$('close').addEventListener('click',()=>{$('full').classList.remove('open');document.body.classList.remove('po')});
$('miniPlay').onclick=$('play').onclick=toggle;
$('next').onclick=$('miniNext').onclick=()=>skip(1);
$('prev').onclick=$('miniPrev').onclick=()=>S.time>4?(S.time=0,T[S.cur].url&&(au.currentTime=0),prog()):skip(-1);
$('fLike').onclick=()=>like(S.cur);
$('shuf').onclick=()=>{S.shuf=!S.shuf;paint();toast(S.shuf?'Shuffle on':'Shuffle off')};
$('rep').onclick=()=>{S.rep=!S.rep;paint();toast(S.rep?'Repeat on':'Repeat off')};
let drag=false;const seek=e=>{const r=$('track').getBoundingClientRect(),p=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));S.time=p*T[S.cur].d;if(T[S.cur].url)au.currentTime=S.time;prog()};
$('track').addEventListener('pointerdown',e=>{drag=true;$('track').classList.add('snap');$('track').setPointerCapture(e.pointerId);seek(e)});
$('track').addEventListener('pointermove',e=>drag&&seek(e));
const endDrag=()=>{drag=false;$('track').classList.remove('snap')};$('track').addEventListener('pointerup',endDrag);$('track').addEventListener('pointercancel',endDrag);
$('close').innerHTML=ic('down');$('miniPrev').innerHTML=ic('prev');$('miniNext').innerHTML=ic('next');
$('prev').innerHTML=ic('prev');$('next').innerHTML=ic('next');$('shuf').innerHTML=ic('shuf');$('rep').innerHTML=ic('rep');
$('play').innerHTML=ic('play');$('miniPlay').innerHTML=ic('play','width:20px');
$('stage').innerHTML=reactor+'<div class="nm">Bobur bek</div>';
$('home').addEventListener('scroll',()=>$('stage').style.setProperty('--so',Math.max(.15,1-$('home').scrollTop/280)),{passive:true});
go('home');
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script><script>
(()=>{
const API='https://discoveryprovider.audius.co/v1',APP='app_name=TRENDMUSIC';
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
function addTrack(x){const url=`${API}/tracks/${x.id}/stream?${APP}`;let i=T.findIndex(t=>t.url===url);if(i>=0)return i;
const h=hue(x.title||'x');T.push({t:x.title||'Untitled',a:(x.user&&x.user.name)||'Artist',h:[h,(h+40)%360],d:x.duration||0,g:'Online',url});return T.length-1}
async function api(p){const r=await fetch(API+p+(p.includes('?')?'&':'?')+APP);if(!r.ok)throw 0;return (await r.json()).data}
let hits=[],loaded=0;
function fill(){const el=$('onRail');if(!el)return;
el.innerHTML=hits.length?hits.map(i=>`<div class="card" data-p="${i}" data-l="online"><div class="art" style="${art(T[i])}"></div><b>${T[i].t}</b><span class="sub">${T[i].a}</span></div>`).join(''):'<div class="sub" id="onMsg">Loading…</div>'}
function load(){if(loaded)return;loaded=1;
api('/tracks/trending?time=week&limit=12').then(d=>{hits=d.map(addTrack);lists.online=hits;fill()})
.catch(()=>{loaded=0;const m=$('onMsg');if(m)m.textContent='Could not load online songs. Check your internet.'})}
const oldHome=renderHome;
renderHome=function(){oldHome();const b=document.createElement('div');b.innerHTML='<h2>Free online songs</h2><div class="rail" id="onRail"></div>';
$('home').insertBefore(b,$('home').lastElementChild);fill();load()};
let st;
function onlineSearch(){clearTimeout(st);const q=$('q').value.trim();if(q.length<2||S.genre!=='All')return;
st=setTimeout(async()=>{try{const d=await api('/tracks/search?query='+encodeURIComponent(q)+'&limit=10');
if($('q').value.trim()!==q)return;const ids=d.map(addTrack),e=$('results');
if(!ids.length)return;const em=e.querySelector('.empty');if(em)em.remove();
e.insertAdjacentHTML('beforeend','<h2>Online results</h2>'+ids.map(i=>row(i,0,'s')).join(''))}catch(_){}},450)}
const oldSearch=renderSearch;
renderSearch=function(){oldSearch();onlineSearch()};
$('q').addEventListener('input',onlineSearch);
install=function(){if(dp){dp.prompt();dp=null}else{toast('Chrome menu ⋮ → Add to Home screen');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('on'),5000)}};
if(S.tab==='home')renderHome();
})();
</script>
</body>
